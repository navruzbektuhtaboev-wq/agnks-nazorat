// ======================================================

const state = {};

allItems.forEach((name,index)=>{
  state[index+1] = {
    name,
    status:"",
    note:"",
    reason:""
  };
});


// ======================================================
// API
// ======================================================

async function api(url, body={}){

  const response = await fetch(url,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      ...body,
      initData
    })
  });

  let data;

  try{
    data = await response.json();
  }catch(e){
    throw new Error("Сервердан нотўғри жавоб келди.");
  }

  if(!response.ok){
    throw new Error(data.error || "Сервер хатоси.");
  }

  return data;
}


// ======================================================
// КУН
// ======================================================

function today(){

  const d = new Date();

  return String(d.getDate()).padStart(2,"0")
    + "."
    + String(d.getMonth()+1).padStart(2,"0")
    + "."
    + d.getFullYear();

}


// ======================================================
// РОЛЬ
// ======================================================

function roleText(role){

  if(role==="machinist") return "👷 Машинист";
  if(role==="engineer") return "👨‍🔧 Муҳандис";
  if(role==="manager") return "👔 Раҳбар";

  return "Фойдаланувчи";

}


// ======================================================
// САҚЛАШ
// ======================================================

function saveLocal(){

  try{
    localStorage.setItem(
      "agnks_control",
      JSON.stringify(state)
    );

    showMessage(
      "success",
      "💾 Маълумотлар телефонда сақланди."
    );

  }catch(e){
    showMessage(
      "error",
      "Сақлашда хатолик."
    );
  }

}


// ======================================================
// ЮКЛАШ
// ======================================================

function loadLocal(){

  try{

    const saved = localStorage.getItem(
      "agnks_control"
    );

    if(!saved) return;

    const data = JSON.parse(saved);

    Object.keys(data).forEach(id=>{

      if(state[id]){

        state[id].status = data[id].status || "";
        state[id].note = data[id].note || "";
        state[id].reason = data[id].reason || "";

      }

    });

  }catch(e){}

}


// ======================================================
// ХАБАР
// ======================================================

function showMessage(type,text){

  const old = document.querySelector(".flash");

  if(old) old.remove();

  const div = document.createElement("div");

  div.className =
    "flash " +
    (type==="success" ? "success":"error");

  div.textContent = text;

  document
    .getElementById("app")
    .prepend(div);

  setTimeout(()=>{
    div.remove();
  },3500);

}


// ======================================================
// ITEM HTML
// ======================================================

function itemHTML(id,name){

  return `

    <div class="item-main">

      <div class="num">${id}</div>

      <div class="item-name">
        ${name}
      </div>

      <div class="arrow">›</div>

    </div>

    <div class="status-box" onclick="event.stopPropagation()">

      <div class="status-buttons">

        <button
          class="status-btn ${s.status==="ok"?"active":""}"
          onclick="setStatus(${id},'ok')"
        >
          🟢 Соз ҳолатда
        </button>

        <button
          class="status-btn ${s.status==="minor"?"active":""}"
          onclick="setStatus(${id},'minor')"
        >
          🟡 Камчиликлар бор
        </button>

        <button
          class="status-btn ${s.status==="bad"?"active":""}"
          onclick="setStatus(${id},'bad')"
        >
          🔴 Носоз ҳолатда
        </button>

      </div>

      <div
        class="field"
        id="note-box-${id}"
        style="display:${s.status==="minor"?"block":"none"}"
      >
        <label>Изоҳ</label>

        <textarea
          onchange="state[${id}].note=this.value"
          placeholder="Камчилик ҳақида изоҳ..."
        >${s.note}</textarea>
      </div>

      <div
        class="field"
        id="reason-box-${id}"
        style="display:${s.status==="bad"?"block":"none"}"
      >

        <label>Носозлик сабаби</label>

        <textarea
          onchange="state[${id}].reason=this.value"
          placeholder="Носозлик сабабини ёзинг..."
        >${s.reason}</textarea>

        <div class="field">

          <label>Қўшимча изоҳ</label>

          <textarea
            onchange="state[${id}].note=this.value"
            placeholder="Қўшимча маълумот..."
          >${s.note}</textarea>

        </div>

      </div>

  `;
}


// ======================================================
// ITEM ОЧИШ
// ======================================================

function toggleItem(id){

  const el = document.getElementById(
    "item-"+id
  );

  if(el){
    el.classList.toggle("open");
  }

}


// ======================================================
// STATUS
// ======================================================

function setStatus(id,status){

  state[id].status = status;

  const item =
    document.getElementById("item-"+id);

  if(!item) return;

  item.outerHTML =
    itemHTML(id,state[id].name);

  document
    .getElementById("item-"+id)
    .classList.add("open");

}

// МАШИНИСТ ИНТЕРФЕЙСИ
// ======================================================

function renderMachinist(me){

  const app =

  let html = `

    <div>

      <div class="user-name">

      </div>

      <div class="role">
        Роль: ${roleText(me.role)}
      </div>

    </div>

    <div class="date">
      ${today()}
    </div>

  </div>

  <div class="card">

    <div class="title">
      📋 Назорат вақти: 08:00 / 12:00 / 17:00
    </div>

// ======================================================
// УСКУНАЛАРНИ ЧИЗИШ
// ======================================================

function renderEquipment(){

  const box =
    document.getElementById("equipment");

  let number = 0;

  groups.forEach(group=>{

    const groupItems = group[1];

    let rows = "";

    groupItems.forEach(name=>{

      number++;

      rows += itemHTML(
        number,
        name
      );

    });

    box.insertAdjacentHTML(
      "beforeend",

      `
      <div class="group">

        <div class="group-head">

          <div class="group-name">
            ${group[0]}
          </div>

          <div class="count">
            ${groupItems.length}
          </div>

        </div>

        ${rows}

      </div>
      `
    );

  });

}


// ======================================================
// ҚИДИРУ
// ======================================================

function filterItems(){

  const value =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  document
    .querySelectorAll(".item")
    .forEach(el=>{

      const name =
        el
          .querySelector(".item-name")
          .textContent
          .toLowerCase();

      el.style.display =
        !value || name.includes(value)
          ? ""
          : "none";

    });

}


// ======================================================
// ҲИСОБОТ ТАЙЁРЛАШ
// ======================================================

function buildReport(){

  const lines = [];

  lines.push(
    "💧 AGNKS ТЕХНИК НАЗОРАТ"
  );

  lines.push(
    `Сана: ${today()}`
  );

  lines.push(
    "Назорат: 08:00 / 12:00 / 17:00"
  );

  lines.push("");

  let okCount = 0;
  let minorCount = 0;
  let badCount = 0;

  allItems.forEach((name,index)=>{

    const id = index+1;
    const s = state[id];

    if(s.status==="ok"){

      okCount++;

      lines.push(
        `🟢 ${id}. ${name}`
      );

    }

    else if(s.status==="minor"){

      minorCount++;

      lines.push(
        `🟡 ${id}. ${name}`
      );

      if(s.note){
        lines.push(
          `   Изоҳ: ${s.note}`
        );
      }

    }

    else if(s.status==="bad"){

      badCount++;

      lines.push(
        `🔴 ${id}. ${name}`
      );

      if(s.reason){
        lines.push(
          `   Носозлик сабаби: ${s.reason}`
        );
      }

      if(s.note){
        lines.push(
          `   Қўшимча изоҳ: ${s.note}`
        );
      }

    }

    else{

      lines.push(
        `⚪ ${id}. ${name} — ҳолат белгиланмаган`
      );

    }

  });

  lines.push("");

  lines.push(
    `Жами: ${allItems.length}`
  );

  lines.push(
    `🟢 Соз: ${okCount}`
  );

  lines.push(
    `🟡 Камчилик: ${minorCount}`
  );

  lines.push(
    `🔴 Носоз: ${badCount}`
  );

  return lines.join("\n");

}


// ======================================================
// ҲИСОБОТ ЮБОРИШ
// ======================================================

async function sendReport(){

  const report =
    buildReport();

  if(!confirm(
    "Ҳисоботни муҳандисга жўнатасизми?"
  )){
    return;
  }

  try{

    const result =
      await api(
        "/api/send-report",
        {
          message:report
        }
      );

    if(result.ok){

      showMessage(
        "success",
        "✅ Ҳисобот муҳандисга юборилди."
      );

    }else{

      showMessage(
        "error",
        result.error || "Юборишда хатолик."
      );

    }

  }catch(error){

    showMessage(
      "error",
      "❌ " + error.message
    );

  }

}

async function sendManager(){

  const note =
    document
      .getElementById("managerNote")
      ?.value || "";

  if(!confirm(
    "Машинистнинг асл хабари раҳбарга юборилсинми?"
  )){
    return;
  }

  try{

    const result =
      await api(
        "/api/send-to-manager",
        {
          note
        }
      );

    if(result.ok){

      showMessage(
        "success",
        "✅ Хабар раҳбарга юборилди."
      );

    }else{

      showMessage(
        "error",
        result.error || "Юборишда хатолик."
      );

    }

  }catch(error){

    showMessage(
      "error",
      "❌ " + error.message
    );

  }

}


// ======================================================
// HTML ХАВФСИЗЛИГИ
// ======================================================

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


// ======================================================
// ИШГА ТУШИРИШ
// ======================================================

async function boot(){

  const app =
    document.getElementById("app");

  if(!initData){

    app.innerHTML = `
      <div class="card notice">
        📱 Telegram Web App орқали очинг.
        <br><br>
        Браузерда тўғридан-тўғри очиш мумкин эмас.
        <br><br>
        Telegram ботда <b>/start</b> босинг.
      </div>
    `;

    return;

  }

  try{

    const result =
      await api(
        "/api/me"
      );

    if(!result.ok){

      throw new Error(
        result.error ||
        "Фойдаланувчи аниқланмади."
      );

    }

    /*
      server.js:
      { ok:true, me:{...} }

      Шунинг учун ме ни тўғридан-тўғри оламиз.
    */

    const me =
      result.me ||
      result.user ||
      result.data?.me;

    if(!me){

      throw new Error(
        "Фойдаланувчи маълумоти сервердан келмади."
      );

    }

    if(me.role==="machinist"){

      renderMachinist(me);

    }

    else if(me.role==="engineer"){

      await renderEngineer(me);

    }

    else{

      app.innerHTML = `
        <div class="card notice">
          ❌ Сизнинг ролиңиз аниқланмади.
          <br><br>
          Telegram ID рўйхатдан ўтказилиши керак.
        </div>
      `;

    }

  }catch(error){

    app.innerHTML = `
      <div class="card notice">

        ❌ <b>Тизимда хатолик</b>

        <br><br>

        ${escapeHtml(error.message)}

      </div>
    `;

  }

}

boot();

</script>

</html>
