<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AGNKS NAZORAT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4f8;color:#15324b}.top{background:linear-gradient(135deg,#075c86,#1287b8);color:#fff;padding:18px 16px 20px;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:800}.sub{opacity:.9;font-size:12px;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 4px 18px #17384b12}.user{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#e8f2fa;border-radius:999px;padding:7px 10px;font-size:12px}.time{font-weight:800;color:#0876ad}.group h3{margin:4px 0 10px;font-size:16px}.equip{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid #edf1f4;cursor:pointer}.equip:first-of-type{border-top:0}.num{width:30px;height:30px;border-radius:9px;background:#0b79bd;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:9px}.ename{flex:1;font-weight:650;font-size:14px}.arrow{font-size:20px;color:#7b8d9b}.search,input,textarea{width:100%;border:1px solid #d6e0e7;border-radius:12px;padding:12px;font:inherit;background:#fff}.search{margin-bottom:12px}.hidden{display:none}.status{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin:9px 0;font-size:15px;font-weight:800;text-align:left;cursor:pointer}.ok{background:#dff7e7;color:#08763b}.warn{background:#fff1c9;color:#8a5b00}.bad{background:#ffdfe1;color:#a31e28}.status.selected{outline:3px solid #0b79bd55}.field{margin-top:10px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#087bc1;color:white;font-size:16px;font-weight:800;cursor:pointer}.btn.green{background:#11a34a}.btn.gray{background:#e7eef3;color:#24445a}.msg{padding:12px;border-radius:12px;background:#f4f8fb;white-space:pre-wrap;font-size:13px;max-height:260px;overflow:auto}.readonly{background:#f5f8fa}.nav{display:flex;gap:8px;position:sticky;bottom:0;background:#eef4f8;padding:8px 0}.nav button{flex:1;border:0;background:#fff;padding:11px 4px;border-radius:12px;font-size:11px;color:#35566d}.count{float:right;background:#edf4f9;border-radius:20px;padding:3px 8px}.success{background:#dcf8e6;color:#08763b;padding:12px;border-radius:12px;font-weight:700}
</style></head>
<body><div class="top"><div class="brand">💧 AGNKS NAZORAT</div><div class="sub">Техник назорат тизими • POYTUG 888 AGNKS</div></div>
<div class="wrap" id="app"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const initData=tg?.initData||'';
const groups=[
['Компрессор тизими',['Компрессор №1','Компрессор №2','Электродвигатель','Компрессор мойлаш тизими','Компрессор совитиш тизими','Кириш фильтри','Газ фильтри','Мой фильтри','Мой ажратгич','Компрессор манометри','Компрессор ҳарорат датчиги']],
['Газ қабул қилиш тизими',['Кириш газ қувури','Газ фильтри','Газ сепаратори','Газ ҳисоблагич']],
['Давлат пломбалари назорати',['Давлат пломбаси — соз ҳолатда, ташқи таъсир кўрсатилмаган','Давлат пломбаси — ташқи таъсир оқибатида узилган','Давлат пломбаси — ташқи таъсир белгилари мавжуд']],
['Юқори босимли газ тизими',['Юқори босимли газ қувури','Запор арматураси','Шарли кранлар','Қайтариш клапанлари','Хавфсизлик клапанлари','Юқори босим манометрлари','Босим датчиклари']],
['Газ сақлаш тизими',['Каскад газ баллонлари','1-каскад','2-каскад','3-каскад','Баллон вентиллари','Каскад манометрлари','Баллон қувурлари','Баллон хавфсизлик клапанлари']],
['Газ тўлдириш колонкалари',['Газ колонкаси №1','Газ колонкаси №2','Газ колонкаси №3','Газ колонкаси №4','Газ колонкаси №5','Газ колонкаси №6','Газ колонкаси №7','Газ колонкаси №8']],
['Электр тизими',['Электр щити','Автомат ўчиргичлар','Электр кабеллари','Заземление тизими','Электр двигателлари']],
['Назорат ва совитиш',['Газ сигнализатори','Газ анализатори','Чиллер','Сув насоси','Сув резервуари']],
['Ёнғин хавфсизлиги',['ОП-5 ўт ўчиргич','ОП-10 ўт ўчиргич','ОП-50 ўт ўчиргич','ОУ-5 ўт ўчиргич','Ёнғин щити','Қум қутиси']],
['Бирикмалар',['Фланецли бирикмалар','Резьбали бирикмалар']]
];
const items=groups.flatMap(g=>g[1]);
let selected={}, current=null, me=null;
const app=document.getElementById('app');
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,initData})});return r.json()}
async function boot(){if(!initData){renderNotice('Telegram Web App орқали очинг.','Браузерда тўғридан-тўғри очиш учун Telegram ботда /start босинг.');return} const x=await api('/api/me',{});if(!x.ok){renderNotice('Кириш тасдиқланмади',x.error);return}me=x; renderHome();}
function renderNotice(a,b){app.innerHTML=`<div class="card"><h2>${a}</h2><p>${b}</p></div>`}
function renderHome(){app.innerHTML=`<div class="card user"><div><b>${me.name}</b><div class="sub">Роль: ${me.role}</div></div><span class="pill">17.09.2026</span></div><div class="card"><div class="time">📋 Назорат вақти: 08:00 / 12:00 / 17:00</div><p style="font-size:13px">Ускуналар: <b>59 та</b></p><input class="search" placeholder="🔎 Ускуна номини қидириш..." oninput="filterItems(this.value)"></div><div id="list"></div>${me.role==='engineer'?'<div class="card"><button class="btn" onclick="engineer()">✉️ Раҳбарга хабар</button></div>':''}`;drawList();}
function drawList(q=''){let html='';let n=0;for(const [title,arr] of groups){const rows=arr.map(name=>{n++;if(q&&!name.toLowerCase().includes(q.toLowerCase()))return '';const idx=items.indexOf(name)+1;return `<div class="equip" onclick="openEquip(${idx})"><span class="num">${idx}</span><span class="ename">${name}</span><span class="arrow">›</span></div>`}).join('');if(rows.trim())html+=`<div class="card group"><h3>${title} <span class="count">${arr.length}</span></h3>${rows}</div>`}document.getElementById('list').innerHTML=html;}
function filterItems(q){drawList(q)}
function openEquip(i){current=i;const name=items[i-1];const v=selected[i]||{};app.innerHTML=`<div class="card"><div style="font-size:13px">УСКУНА ${i} / 59</div><h2>${name}</h2><button class="status ok ${v.status==='ok'?'selected':''}" onclick="choose('ok')">🟢 Соз ҳолатда</button><button class="status warn ${v.status==='warn'?'selected':''}" onclick="choose('warn')">🟡 Камчиликлар бор</button><button class="status bad ${v.status==='bad'?'selected':''}" onclick="choose('bad')">🔴 Носоз ҳолатда</button><div id="fields"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn gray" onclick="renderHome()">← Рўйхат</button><button class="btn" onclick="saveEquip()">Сақлаш →</button></div></div>`;if(v.status)choose(v.status)}
function choose(s){selected[current]={...(selected[current]||{}),status:s};document.querySelectorAll('.status').forEach(x=>x.classList.remove('selected'));document.querySelector('.'+({ok:'ok',warn:'warn',bad:'bad'}[s])).classList.add('selected');const f=document.getElementById('fields');if(s==='ok')f.innerHTML='';else if(s==='warn')f.innerHTML=`<div class="field"><label>Изоҳ</label><textarea id="note" placeholder="Камчилик ҳақида ёзинг...">${selected[current].note||''}</textarea></div>`;else f.innerHTML=`<div class="field"><label>Носозлик сабаби</label><input id="reason" value="${selected[current].reason||''}" placeholder="Сабабини ёзинг..."><label style="margin-top:10px">Қўшимча изоҳ</label><textarea id="note" placeholder="Қўшимча маълумот...">${selected[current].note||''}</textarea></div>`}
function saveEquip(){const v=selected[current];if(v.status==='warn')v.note=document.getElementById('note')?.value||'';if(v.status==='bad'){v.reason=document.getElementById('reason')?.value||'';v.note=document.getElementById('note')?.value||''}renderHome()}
function buildReport(){const lines=[`📋 AGNKS ТЕХНИК НАЗОРАТ`,`👷 Машинист: ${me.name}`,`🕐 Назорат: 08:00 / 12:00 / 17:00`,`📅 17.09.2026`,``,`УСКУНАЛАР:`];items.forEach((name,i)=>{const v=selected[i+1];if(!v)return;lines.push(`${i+1}. ${name} — ${v.status==='ok'?'🟢 Соз ҳолатда':v.status==='warn'?'🟡 Камчиликлар бор':'🔴 Носоз ҳолатда'}`);if(v.reason)lines.push(`   Носозлик сабаби: ${v.reason}`);if(v.note)lines.push(`   Изоҳ: ${v.note}`)});return lines.join('\n')}
async function submit(){const missing=items.findIndex((_,i)=>!selected[i+1]);if(missing>=0){alert(`№${missing+1} ускуна ҳолати белгиланмаган.`);openEquip(missing+1);return}const message=buildReport();const r=await api('/api/send-report',{message});if(r.ok){app.innerHTML=`<div class="card"><div class="success">✅ Ҳисобот муҳандис ва иккинчи машинистга юборилди.</div><h3>Ҳисобот тайёр</h3><div class="msg">${message}</div><button class="btn green" onclick="renderHome()">Янги назорат</button></div>`}else alert(r.error)}
function engineer(){api('/api/latest-machinist-message',{}).then(x=>{app.innerHTML=`<div class="card"><h2>✉️ Раҳбарга хабар</h2><p style="font-size:13px">Муҳандис учун: машинистнинг охирги хабари ўзгармас ҳолда қолади.</p><div class="msg readonly">${x.message||'Ҳозирча машинист хабари йўқ.'}</div><div class="field"><label>Қўшимча изоҳ (ихтиёрий)</label><textarea id="managerNote" placeholder="Фақат пастига қўшилади..."></textarea></div><button class="btn green" onclick="sendManager(${JSON.stringify(x.message||'')})">Раҳбарга юбориш</button><button class="btn gray" style="margin-top:8px" onclick="renderHome()">← Орқага</button></div>`})}
async function sendManager(original){if(!original)return alert('Машинист хабари мавжуд эмас.');const note=document.getElementById('managerNote').value;const r=await api('/api/send-to-manager',{originalMessage:original,note});alert(r.ok?'✅ Раҳбарга юборилди.':r.error)}
app.insertAdjacentHTML('beforeend','');
window.openEquip=openEquip;window.choose=choose;window.saveEquip=saveEquip;window.filterItems=filterItems;window.submit=submit;window.engineer=engineer;window.sendManager=sendManager;
boot();
</script></body></html>
